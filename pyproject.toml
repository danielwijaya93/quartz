[project]
name = "quartz"
version = "0.1.0"
description = "Minimal coding agent with a persistent Python REPL"
requires-python = ">=3.14"
dependencies = [
    "dill>=0.4.1",
    "mcp>=2.3.0",
    "openai>=3.52.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
quartz = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
