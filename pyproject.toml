[project]
name = "quartz-agent"
version = "0.1.0"
description = "Minimal coding agent with a persistent Python REPL"
requires-python = ">=3.14"
dependencies = [
    "dill>=0.4.1",
    "fastapi>=0.115",
    "httpx2>=2.16.2",
    "mcp>=2.3.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
]

[project.scripts]
quartz = "quartz.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quartz"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
