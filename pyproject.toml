[project]
name = "quartz-agent"
version = "0.22.5"
description = "Minimal coding agent with a persistent Python REPL"
requires-python = ">=3.14"
dependencies = [
    "dill>=0.4.1",
    "fastapi>=0.115",
    "httpx2>=2.16.2",
    "mcp>=2.3.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.5.0",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
]

[project.scripts]
quartz = "quartz.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quartz"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.390",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "S110", "S112"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.pyright]
include = ["src/quartz"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

